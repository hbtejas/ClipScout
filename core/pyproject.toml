[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "videomind"
version = "0.1.0"
description = "Core multimodal processing engine for Conversational Video RAG"
authors = [{ name = "ClipScout Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "qdrant-client>=1.8.0",
    "sentence-transformers>=2.6.0",
    "openai-whisper>=20231117",
    "imageio-ffmpeg>=0.4.9",
    "yt-dlp>=2024.3.10",
    "openai>=1.14.0",
    "supabase>=2.3.0",
    "python-dotenv>=1.0.1",
]
